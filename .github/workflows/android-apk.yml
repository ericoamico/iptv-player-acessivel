name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos e testes
        run: |
          npm run typecheck
          npm test

      - name: Definir versão (build = número da execução)
        env:
          RUN: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            a.expo.version = "1.0." + process.env.RUN;
            a.expo.android.versionCode = Number(process.env.RUN);
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
          '

      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --no-install

      - name: Configurar chave de assinatura
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Segredo ANDROID_KEYSTORE_BASE64 não configurado. O APK será assinado com a chave de TESTE (pública)."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          cat >> android/app/build.gradle <<'GRADLE'

          // Assinatura de produção (adicionada pelo workflow; a chave vem dos segredos do GitHub).
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Compilar APK (release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renomear APK e gerar latest.json
        env:
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk iptv-acessivel.apk
          rm -f "$RUNNER_TEMP/release.keystore"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          export SIGNER=$("$APKSIGNER" verify --print-certs iptv-acessivel.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Certificado do APK (SHA-256): $SIGNER"
          node -e '
            const run = Number(process.env.RUN);
            require("fs").writeFileSync("latest.json", JSON.stringify({
              versionCode: run,
              version: "1.0." + run,
              apkUrl: "https://github.com/" + process.env.REPO + "/releases/download/apk-latest/iptv-acessivel.apk",
              notes: (process.env.MSG || "").split("\n")[0],
              publishedAt: new Date().toISOString(),
              signerSha256: process.env.SIGNER,
            }, null, 2));
          '
          cat latest.json

      - uses: actions/upload-artifact@v5
        with:
          name: iptv-acessivel-apk
          path: |
            iptv-acessivel.apk
            latest.json

      - name: Publicar na release "apk-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest iptv-acessivel.apk latest.json \
            --title "APK de teste (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}." \
            --prerelease --target "${{ github.sha }}"
